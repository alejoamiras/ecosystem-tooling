# Supply-chain hardening
[install]
# 7-day quarantine for new npm publishes (supply-chain worm protection).
minimumReleaseAge = 604800
# EMPIRICAL (bun 1.3.x): glob patterns are NOT supported here, and transitives are gated
# independently — an exclusion must name every package in the Aztec dependency closure
# (alias-aware: `viem` resolves to @aztec/viem at its OWN version).
# Only Aztec-scoped packages whose resolved version is YOUNGER than 7 days are exempted,
# so lockstep tooling can install an upstream release the day it ships; each name drops
# off once its version clears the gate. Compensating controls live in the bump-aztec
# supply-chain report (publish date, publisher, attestation presence). NEVER hand-edit
# the excludes line — `bun scripts/bump-aztec.ts <version>` writes it from the registry
# closure pre-install, and `--regenerate-excludes` rewrites it from the real lockfile.
minimumReleaseAgeExcludes = ["@aztec-foundation/bb-avm-sim", "@aztec-foundation/bb-avm-sim-darwin-arm64", "@aztec-foundation/bb-avm-sim-darwin-x64", "@aztec-foundation/bb-avm-sim-linux-arm64", "@aztec-foundation/bb-avm-sim-linux-x64", "@aztec-foundation/bb.js", "@aztec-foundation/cdb", "@aztec-foundation/ipc-runtime", "@aztec-foundation/l1-artifacts", "@aztec-foundation/noir-acvm_js", "@aztec-foundation/noir-noir_codegen", "@aztec-foundation/noir-noirc_abi", "@aztec-foundation/noir-types", "@aztec-foundation/wsdb", "@aztec-foundation/wsdb-darwin-arm64", "@aztec-foundation/wsdb-darwin-x64", "@aztec-foundation/wsdb-linux-arm64", "@aztec-foundation/wsdb-linux-x64", "@aztec-labs/accounts", "@aztec-labs/aztec.js", "@aztec-labs/bb-prover", "@aztec-labs/blob-lib", "@aztec-labs/constants", "@aztec-labs/entrypoints", "@aztec-labs/ethereum", "@aztec-labs/foundation", "@aztec-labs/key-store", "@aztec-labs/kv-store", "@aztec-labs/native", "@aztec-labs/noir-contracts.js", "@aztec-labs/noir-protocol-circuits-types", "@aztec-labs/protocol-contracts", "@aztec-labs/pxe", "@aztec-labs/simulator", "@aztec-labs/sqlite3mc-wasm", "@aztec-labs/standard-contracts", "@aztec-labs/stdlib", "@aztec-labs/telemetry-client", "@aztec-labs/wallet-sdk", "@aztec-labs/wallets", "@aztec-labs/world-state"]
