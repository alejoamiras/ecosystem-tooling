name: Quota Paymaster

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      relevant: ${{ steps.override.outputs.relevant || steps.filter.outputs.relevant }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        id: filter
        with:
          filters: |
            relevant:
              - 'packages/quota-paymaster/**'
              - '!packages/quota-paymaster/**/*.md'
              - 'biome.json'
              - 'package.json'
              - 'bun.lock'
              - 'bunfig.toml'
              - '.github/workflows/quota-paymaster.yml'
              - '.github/workflows/_package-checks.yml'
              - '.github/actions/**'
      - name: Override for manual dispatch
        if: github.event_name == 'workflow_dispatch'
        id: override
        run: echo "relevant=true" >> "$GITHUB_OUTPUT"

  checks:
    name: Checks
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    uses: ./.github/workflows/_package-checks.yml
    with:
      package-dir: packages/quota-paymaster
      min-txe-tests: 20
      # The time-travel suite self-provisions its own disposable network
      # (ephemeral ports + own anvil), so it coexists with the job's main one.
      run-warp-tests: true
